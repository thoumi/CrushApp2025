@if (member(); as member) {
<div routerLink="/members/{{member.id}}" class="card cursor-pointer transition-all duration-300 ease-in-out 
        transform hover:-translate-y-2 relative">
    <img src="{{member?.imageUrl || '/user.png'}}" alt="{{member.displayName}} image" class="rounded-lg">
    
    @if (isOnline()) {
        <span class="status status-success status-xl absolute top-3 left-3"></span>
    }
    
    <button (click)="toggleLike($event)" class="absolute top-1 right-1 z-40 btn btn-ghost btn-circle"
        [class]="hasLiked() ? 'text-primary' : 'text-white'">
        <svg xmlns="http://www.w3.org/2000/svg"
            [attr.fill]="hasLiked() ? 'currentColor' : 'none'"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-7"
        >
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
    </button>
    <div class="card-actions z-40
            absolute bottom-0 w-full px-3 py-1 rounded-b-lg
            bg-gradient-to-t from-[#14121F] via-[#14121F]/75 to-[#14121F]/0
        ">
        <div class="flex flex-col text-white pb-1">
            <span class="font-semibold">{{member.displayName}}, {{member.dateOfBirth | age}}</span>
            <span class="text-sm text-white/80">{{member.city}}</span>
            @if (featuredPrompt(); as prompt) {
                <div class="mt-2 mb-1 bg-white/10 backdrop-blur-sm rounded-lg px-2.5 py-2 border border-white/15">
                    <div class="text-[0.65rem] uppercase tracking-wide text-white/60">{{prompt.prompt.text}}</div>
                    <div class="font-display text-sm text-white leading-snug line-clamp-2">{{prompt.answer}}</div>
                </div>
            }
        </div>

    </div>
</div>
}
