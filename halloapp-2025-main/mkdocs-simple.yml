# Configuration MkDocs pour Documentation HalloApp
site_name: HalloApp - Documentation Technique Complète
site_description: Documentation complète de HalloApp - Application de rencontres moderne avec Angular 20 et ASP.NET Core 9, migration vers microservices
site_author: HalloApp Dev Team
site_url: https://thoumi.github.io/CrushApp2025/

# Theme
theme:
  name: material
  language: fr
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Basculer en mode sombre
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Basculer en mode clair
  
  font:
    text: Roboto
    code: Roboto Mono
  
  features:
    - navigation.instant        # Navigation rapide sans rechargement
    - navigation.tracking       # Ancre URL mise à jour
    - navigation.tabs           # Onglets navigation
    - navigation.sections       # Sections dans sidebar
    - navigation.top            # Bouton retour en haut
    - search.suggest            # Suggestions recherche
    - search.highlight          # Surligner résultats
    - content.code.copy         # Copier code blocks
    - content.action.edit       # Bouton éditer page
    - toc.integrate             # Intégrer TOC dans sidebar (masque TOC à droite)
  
  icon:
    edit: material/pencil
    view: material/eye

# Plugins
plugins:
  - search:
      lang: 
        - fr
        - en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      locale: fr

# Extensions Markdown
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - footnotes
  - attr_list
  - def_list
  - abbr

# Navigation Flexible et Modulaire
nav:
- Accueil: index-simple.md
- Guide Utilisateur:
  - Fonctionnalités: guide/01-FONCTIONNALITES-SIMPLE.md
  - Guide Utilisateur: guide/02-GUIDE-UTILISATEUR.md
- Guide Technique:
  - Migration Angular: guide/03-MIGRATION-ANGULAR.md
  - Migration .NET: guide/04-MIGRATION-DOTNET.md
  - Migration Microservices: guide/05-MIGRATION-MICROSERVICES.md
  - Architecture: architecture/00-OVERVIEW.md
- Déploiement:
  - Docker Compose: architecture/03-DOCKER-COMPOSE-COMPLETE.md
- Résolution des Problèmes:
  - Guide WebSocket: TROUBLESHOOTING-WEBSOCKET.md

