# Configuration MkDocs Simplifiée - Documentation Essentielle
site_name: CrushApp - Documentation Essentielle
site_description: Documentation essentielle de CrushApp - Application de rencontres moderne
site_author: CrushApp Dev Team
site_url: https://thoumi.github.io/CrushApp2025/

# Repository
repo_name: thoumi/CrushApp2025
repo_url: https://github.com/thoumi/CrushApp2025
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  
  font:
    text: Roboto
    code: Roboto Mono
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.integrate
  
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

# Plugins
plugins:
  - search:
      lang: 
        - fr
        - en
  - minify:
      minify_html: true

# Extensions Markdown
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - footnotes
  - attr_list
  - def_list
  - abbr

# Navigation Simplifiée - Fichiers Essentiels Seulement
nav:
  - Accueil: index-simple.md
  
  - Guide Utilisateur:
      - Fonctionnalités: guide/01-FONCTIONNALITES-SIMPLE.md
      - Guide Utilisateur: guide/02-GUIDE-UTILISATEUR.md
  
  - Guide Technique:
      - Migration Angular: guide/03-MIGRATION-ANGULAR.md
      - Architecture: architecture/00-OVERVIEW.md
  
  - Déploiement:
      - Quick Start: QUICKSTART-MIGRATION.md
      - Docker Compose: architecture/03-DOCKER-COMPOSE-COMPLETE.md
      - Status Final: STATUS-FINAL.md
  
  - Résolution des Problèmes:
      - Guide WebSocket: TROUBLESHOOTING-WEBSOCKET.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thoumi/CrushApp2025
      name: GitHub
  
  version:
    provider: mike
    default: latest

# Copyright
copyright: Copyright &copy; 2025 CrushApp Dev Team - Documentation Essentielle
