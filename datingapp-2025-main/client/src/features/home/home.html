<div class="halo-hero hero min-h-screen">
    @if (!registerMode()) {
    <div class="hero-content text-center relative z-10">
        <div class="flex flex-col items-center max-w-xl">
            <svg class="halo-mark-ring mb-6" width="88" height="88" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="75" cy="75" r="62" stroke="currentColor" stroke-width="2.5" stroke-dasharray="298 96" stroke-linecap="round" transform="rotate(-38 75 75)"/>
                <circle cx="75" cy="75" r="44" stroke="currentColor" stroke-width="9" stroke-dasharray="221 55" stroke-linecap="round" transform="rotate(20 75 75)"/>
            </svg>
            <h1 class="font-display text-5xl md:text-6xl font-semibold tracking-tight text-base-content leading-[0.98]">{{ 'home.title' | translate }}</h1>
            <p class="py-6 text-base-content/70 text-lg max-w-md">{{ 'home.subtitle' | translate }}</p>
            <div class="flex items-center gap-3">
                @if (!accountService.currentUser()) {
                <button (click)="showRegister(true)"
                    class="btn btn-primary btn-lg">{{ 'home.register' | translate }}</button>
                }
                <button class="btn btn-outline btn-lg border-base-content/20 text-base-content hover:bg-base-content hover:text-base-100">{{ 'home.learnMore' | translate }}</button>
            </div>
        </div>
    </div>
    } @else {
        <div class="w-full text-2xl text-center flex justify-center relative z-10">
            <app-register
                class="w-full"
                (cancelRegister)="showRegister($event)"
            />
        </div>
    }

</div>
